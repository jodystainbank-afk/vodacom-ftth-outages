name: Live FNO & Vuma Outage Autonomous Sync

on:
  schedule:
    # Runs every 15 minutes, 24/7/365
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths-ignore:
      - 'public/data/outages.json'

jobs:
  sync:
    name: Scrape Vuma B2B & Public FNOs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Chromium Binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run Outage Scraper Engine
        env:
          VUMA_PORTAL_URL: ${{ secrets.VUMA_PORTAL_URL }}
          VUMA_USERNAME: ${{ secrets.VUMA_USERNAME }}
          VUMA_PASSWORD: ${{ secrets.VUMA_PASSWORD }}
        run: |
          python scripts/sync_all_outages.py

      - name: Commit & Push Live Outage Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/outages.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "⚡ Live FNO & Vuma B2B Outage Sync"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
